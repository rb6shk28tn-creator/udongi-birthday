
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우동이 생일 축하해! 🎂</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 24px 14px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  color: #754d66;
  background: linear-gradient(145deg, #ffe6f0, #f0e7ff, #fff5e9);
}

.card {
  width: 100%;
  max-width: 440px;
  padding: 28px 20px;
  text-align: center;
  background: rgba(255,255,255,.9);
  border: 3px solid white;
  border-radius: 30px;
  box-shadow: 0 12px 35px #d9a5c455;
}

.eyebrow {
  color: #e66b9a;
  letter-spacing: 3px;
  font-size: 12px;
  font-weight: bold;
}

h1 {
  color: #dc568b;
  font-size: 29px;
  margin: 10px 0;
}

.subtitle { color: #ad829b; font-size: 14px; }

.photo {
  width: 180px;
  height: 215px;
  object-fit: cover;
  border-radius: 23px;
  border: 5px solid #ffd4e5;
  background: #ffeaf3;
  margin: 12px auto;
}

.photo-note {
  font-size: 11px;
  color: #ad91a3;
}

.bubble {
  margin: 20px 0;
  padding: 17px 12px;
  border-radius: 20px;
  background: #fff0f6;
  border: 1px solid #ffd2e2;
  line-height: 1.9;
  font-size: 15px;
}

.fanmade {
  font-size: 10px;
  color: #b18ba3;
  margin-top: 7px;
}

h2 { font-size: 18px; }

.hint {
  color: #a98a9f;
  font-size: 12px;
  line-height: 1.7;
}

.numbers {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 7px;
  margin: 18px 0;
}

.number {
  display: flex;
  justify-content: center;
  align-items: center;
  aspect-ratio: 1;
  border: 2px solid #f6c3d8;
  border-radius: 15px;
  background: white;
  color: #db598d;
  font-size: 25px;
  font-weight: bold;
  box-shadow: 0 4px 0 #f5dce7;
}

.number.filled {
  background: linear-gradient(135deg, #ffc1d7, #e6d5ff);
  color: #804567;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 16px;
  background: linear-gradient(100deg, #f477a5, #bd91f0);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px 0 #e7c7e8;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #e7c7e8;
}

.result {
  min-height: 24px;
  margin-top: 17px;
  font-size: 13px;
  color: #a76d8c;
}

.footer {
  margin-top: 22px;
  font-size: 11px;
  color: #ba9daf;
}
</style>
</head>

<body>
<main class="card">
  <p class="eyebrow">HAPPY BIRTHDAY ♡</p>
  <h1>우동이 생일 축하해! 🎂</h1>
  <p class="subtitle">오늘 하루 세상에서 제일 행복하기 ♡</p>

  <!-- 차우민 배우 사진을 넣으려면 아래 이미지 주소를 교체해 주세요. -->
  <img
    class="photo"
    src="https://placehold.co/400x480/ffe6f0/ba638a?text=Cha+Woo-min"
    alt="차우민 배우 사진"
  >
  <p class="photo-note">차우민 배우 · 생일 팬메이드 페이지</p>

  <div class="bubble">
    우동아, 생일 축하해! 🎂<br>
    오늘은 네가 주인공이니까<br>
    행운의 숫자 5개 뽑아 봐! 🍀<br>
    올해 좋은 일만 가득하길 ♡
    <div class="fanmade">
      ※ 팬메이드 축하 메시지이며 실제 발언이 아닙니다.
    </div>
  </div>

  <h2>🎁 행운의 숫자 뽑기 🎁</h2>
  <p class="hint">
    첫 번째 숫자는 1~5<br>
</html>
